<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply the saved theme before first paint (same rules as src/theme.ts).
      (function () {
        var p; try { p = localStorage.getItem("bclaw:theme"); } catch (e) {}
        var t = p === "light" || p === "dark" ? p : window.matchMedia && !window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#FFFFFF");
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>BinanceClaw</title>
  </head>
  <body class="bg-bg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

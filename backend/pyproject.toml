[project]
name = "binanceclaw"
version = "0.1.0"
description = "AI-driven Binance spot portfolio manager with hard risk limits, web dashboard and Telegram approvals"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "httpx>=0.27",
  "pydantic>=2.8",
  "argon2-cffi>=23.1",
  "itsdangerous>=2.2",
  "matplotlib>=3.8",
  "websockets>=13",          # real-time prices (also pulled in by uvicorn[standard])
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
binanceclaw = "binanceclaw.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["binanceclaw*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

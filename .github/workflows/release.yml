name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Version tag to create, e.g. v0.1.0", required: true }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          awk -v v="$TAG" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "见 [CHANGELOG.md](CHANGELOG.md)。" > notes.md
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        # On a tag push the tag already exists; from workflow_dispatch the release creates it at this commit
        run: gh release create "$TAG" --title "BinanceClaw $TAG" --notes-file notes.md --target "$GITHUB_SHA"

name: release
on:
  push:
    tags: ["v*"]
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME}" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "见 [CHANGELOG.md](CHANGELOG.md)。" > notes.md
      - name: Create GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --title "BinanceClaw $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

name: docs
on:
  push:
    branches: [main]
    paths: [docs/**, mkdocs.yml, SECURITY.md, CHANGELOG.md, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, mkdocs.yml, SECURITY.md, CHANGELOG.md, .github/workflows/docs.yml]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "mkdocs<2" "mkdocs-material==9.7.7"
      - name: Bring root files into the site
        run: |
          cp SECURITY.md docs/security.md
          cp CHANGELOG.md docs/changelog.md
          mkdir -p docs/assets && cp frontend/public/favicon.svg docs/assets/
          sed -i -e "s#\.\./SECURITY\.md#security.md#g" -e "s#\.\./CHANGELOG\.md#changelog.md#g" docs/*.md
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with: { path: site }
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
